name: Tipy Agent Evaluation Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  tipy-agent-evaluation:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"
          cache-dependency-path: "server/yarn.lock"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Check for linter errors
        run: |
          echo "Checking TypeScript compilation..."
          npx tsc --noEmit
          echo "✅ TypeScript compilation successful"

      - name: Run Tipy Agent Evaluation Tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NODE_ENV: test
        run: |
          echo "🤖 Starting Tipy Agent Evaluation Tests with Mastra Evals..."
          yarn test:run --reporter=verbose
          echo "✅ All evaluation tests passed!"

      - name: Generate test report
        if: always()
        run: |
          echo "📊 Test Summary:"
          echo "- Context Relevancy: Evaluated agent's use of relevant context"
          echo "- Contextual Recall: Verified incorporation of provided information"
          echo "- Context Precision: Assessed logical grouping of context chunks"
          echo "- Hallucination Detection: Checked for invented information"
          echo "- Prompt Alignment: Verified adherence to prompt guidelines"
          echo "- Agent Workflow: Confirmed required tools and structure"

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🤖 Tipy Agent Evaluation Results
              
              The Tipy agent has been evaluated using Mastra evals to ensure it follows the rules defined in its prompt:
              
              ### 📋 Evaluation Metrics
              - ✅ **Context Relevancy**: Agent uses relevant context for user queries
              - ✅ **Contextual Recall**: Agent incorporates provided information effectively
              - ✅ **Context Precision**: Agent groups context chunks logically  
              - ✅ **Hallucination Detection**: Agent avoids inventing information
              - ✅ **Prompt Alignment**: Agent follows prompt guidelines (max 3 paragraphs, Portuguese, etc.)
              - ✅ **Agent Workflow**: Agent has required tools and structure
              
              ### 🎯 Key Compliance Checks
              - Portuguese Brazilian language ✅
              - Tipspace terminology (Tips vs Apostas) ✅
              - Maximum 3 paragraphs per response ✅
              - Required workflow (getUserTool → Analysis → tipyQueryTool) ✅
              - Knowledge base grounding ✅
              
              All evaluation tests have passed! The agent is ready for production deployment. 🚀`
            })
